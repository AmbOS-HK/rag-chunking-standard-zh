name: validate-docx

on:
  push:
    paths: ["docs/**", "scripts/**", "tools/**", "package.json", "package-lock.json"]
  pull_request:
    paths: ["docs/**", "scripts/**", "tools/**", "package.json", "package-lock.json"]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Validate docx integrity
        shell: pwsh
        run: python tools/validate_docx.py (Get-ChildItem docs -Filter *.docx).FullName
      - name: Check docs in sync with scripts
        run: python tools/check_sync.py
